spring:
  application:
    name: floor-general-backend

  profiles:
    default: dev

  datasource:
    url: jdbc:postgresql://localhost:55432/floorgeneral_dev
    username: ${DB_USERNAME:floorgeneral}
    password: ${DB_PASSWORD:floorgeneral}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Europe/Belgrade

  flyway:
    locations: classpath:db/migration

  # Mejl obavestenje o novoj prijavi (D-20). SMTP server i nalog dolaze iz env-a:
  # SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD.
  # Bez SPRING_MAIL_HOST slanje je iskljuceno, a prijave se i dalje upisuju u bazu.
  mail:
    port: 587
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  jackson:
    time-zone: Europe/Belgrade
    date-format: dd.MM.yyyy

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    issuer: floor-general-liga
    expiration: 1h
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
  mail:
    # Na koju adresu stize obavestenje o svakoj novoj prijavi; vise adresa se odvaja zarezom.
    applications-to: ${APPLICATIONS_MAIL_TO:floorgeneral.rs@gmail.com}
    # Posiljalac; prazno = SMTP nalog (SPRING_MAIL_USERNAME).
    from: ${MAIL_FROM:}
    # Javna adresa sajta, za link ka /admin/prijave u mejlu.
    site-url: ${SITE_URL:https://63-187-111-51.sslip.io}
  rules:
    # BR-10.4 — posle koliko nedolazaka sistem PREDLAZE iskljucenje igraca (odluku donosi admin).
    # Broj jos nije potvrdjen kod narucioca; kad bude, seli se na Season kao kolona.
    walkover-warning-threshold: 2
    # Minimalna duzina lozinke admin naloga (UC-ADM-13).
    min-password-length: 8
