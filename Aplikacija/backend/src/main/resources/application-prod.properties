# Profil "prod" ukljucuje docker-compose na serveru (SPRING_PROFILES_ACTIVE=prod).
# URL baze dolazi iz compose-a (SPRING_DATASOURCE_URL), a kredencijali iz
# /data/secrets/floor-general.env koji renderuje ssm-env -- nista tajno nije ovde.
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Namerno BEZ podrazumevane vrednosti: ako ADMIN_PASSWORD nije u env-u, AdminSeeder
# obori start -- umesto da na javnom serveru napravi admin/admin123 iz application.yml.
app.admin.password=${ADMIN_PASSWORD}

# Iza nginx-a: X-Forwarded-* zaglavlja odredjuju sema/host u generisanim linkovima.
server.forward-headers-strategy=framework

# Pravi podaci lige (sezona, grupe, igraci, rezultati) -- jednokratni seed V14 u db/prod.
# Dev seed (db/dev) se ovde NIKAD ne ukljucuje: nosi izmisljene lige, terene i test naloge.
spring.flyway.locations=classpath:db/migration,classpath:db/prod
