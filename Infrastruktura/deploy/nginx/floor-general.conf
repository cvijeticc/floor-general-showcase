# nginx vhost za Floor General. Zivi na hostu (ne u compose-u), pa certbot
# moze da menja sertifikate bez diranja aplikacije.
#
# Domen (23.11.2026., Infrastruktura/DOMEN.md): glavna adresa je https://www.floorgeneral.rs.
# floorgeneral.rs, stara adresa 63-187-111-51.sslip.io i sav http idu na nju sa 301.
#
# HTTPS: JEDAN Let's Encrypt sertifikat (cert-name 63-187-111-51.sslip.io) pokriva sva tri imena.
# Izdaje ga i prosiruje deploy (`certbot certonly --nginx --expand`, .github/workflows/deploy.yml),
# a obnavlja certbot timer na masini. `certonly` NE menja ovaj fajl, pa ovde nema blokova
# "managed by Certbot" -- deploy ionako prepisuje fajl iz repoa (05.10.2026. je tako nestao HTTPS).

# Kes za javne strane: tabele, raspored i drvo su read-only i citaju ih hiljade
# ljudi istovremeno (NFR-2: 3.000 u spicu). Bez ovoga svaki refresh ide do SSR-a.
proxy_cache_path /var/cache/nginx/floor-general
                 levels=1:2
                 keys_zone=fg_cache:10m
                 max_size=1g
                 inactive=10m
                 use_temp_path=off;

# Zastita od naleta na pisanje (unos rezultata, login) -- ne dira citanje.
limit_req_zone $binary_remote_addr zone=fg_write:10m rate=10r/s;

upstream fg_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Glavni sajt: www.floorgeneral.rs (i svaki nepoznat Host na 443, zbog default_server).
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server ipv6only=on;
    server_name www.floorgeneral.rs;

    ssl_certificate     /etc/letsencrypt/live/63-187-111-51.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/63-187-111-51.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Prava adresa posetioca kad se ubaci Cloudflare (inace svi logovi
    # pokazuju CF-ove IP-jeve). Ukljuciti TEK kad CF bude ispred.
    # real_ip_header CF-Connecting-IP;
    # set_real_ip_from 0.0.0.0/0;

    client_max_body_size 10m;

    access_log /var/log/nginx/floor-general.access.log;
    error_log  /var/log/nginx/floor-general.error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Health probe za nas, ne za aplikaciju -- odgovara i kad app lezi.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # certbot HTTP-01 challenge (na 443 samo za svaki slucaj; Let's Encrypt ide na 80)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # /api/* su Next.js rute (prijava, proxy ka backendu koji dodaje JWT iz
    # httpOnly kolacica). Spring NIJE izlozen spolja -- browser ga nikad ne zove
    # direktno, pa ni Swagger ni /api/v1 nisu dostupni sa interneta.
    location /api/ {
        limit_req zone=fg_write burst=20 nodelay;

        proxy_pass http://fg_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # Next.js build artefakti -- hesirana imena, pa se kesiraju agresivno.
    location /_next/static/ {
        proxy_pass http://fg_frontend;
        proxy_cache fg_cache;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Cache-Status $upstream_cache_status;
    }

    location / {
        proxy_pass http://fg_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Kratak kes javnih strana: ISR ionako osvezava sadrzaj, a ovih 60s
        # nosi spic posle objave rezultata.
        proxy_cache fg_cache;
        proxy_cache_valid 200 60s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        # Prijavljeni korisnici (admin, zapisnicar) NE smeju da dobiju kesiranu
        # stranu nekog drugog.
        # fg_token = kolacic sa JWT-om (Aplikacija/frontend/lib/api/config.ts).
        proxy_cache_bypass $cookie_fg_token $http_authorization;
        proxy_no_cache     $cookie_fg_token $http_authorization;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

}

# floorgeneral.rs i stara adresa sslip.io -> www.floorgeneral.rs (ista putanja).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name floorgeneral.rs 63-187-111-51.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/63-187-111-51.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/63-187-111-51.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://www.floorgeneral.rs$request_uri;
    }
}

# http: sve na https://www.floorgeneral.rs, osim certbot provere (HTTP-01 ide preko porta 80).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name www.floorgeneral.rs floorgeneral.rs 63-187-111-51.sslip.io _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://www.floorgeneral.rs$request_uri;
    }
}
