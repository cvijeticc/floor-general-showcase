name: CI

# Samo build i testovi. Nema push-a imidza ni deploy-a: produkcijski pipeline je u
# Infrastruktura/deploy/github-deploy.yml i radi iz privatnog repoa.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21, unit + Testcontainers IT)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Aplikacija/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify

  frontend:
    name: Frontend (lint, tipovi, testovi, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Aplikacija/frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Aplikacija/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
